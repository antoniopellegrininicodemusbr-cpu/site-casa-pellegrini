<!DOCTYPE html>
<html lang="pt-BR">
<head>

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-PQ9GBFSJ');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Pellegrini — cadastro</title>

    <!-- Página-ponte de conversão: NÃO indexar (não é conteúdo, é tracking + redirect) -->
    <meta name="robots" content="noindex, nofollow">

    <style>
        :root { --vermelho:#b91c1c; --vermelho-esc:#991b1b; --ambar:#f59e0b; }
        * { box-sizing: border-box; }
        html,body { margin:0; height:100%; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(160deg, var(--vermelho) 0%, var(--vermelho-esc) 100%);
            color:#fff; display:flex; align-items:center; justify-content:center;
            min-height:100vh; padding:24px; text-align:center;
        }
        .card { max-width:420px; width:100%; }
        .marca { font-size:1.9rem; font-weight:800; letter-spacing:.5px; margin:0 0 6px; }
        .marca span { color:var(--ambar); }
        .msg { font-size:1.05rem; opacity:.95; margin:0 0 26px; line-height:1.45; }
        .spinner {
            width:44px; height:44px; margin:0 auto 26px; border-radius:50%;
            border:4px solid rgba(255,255,255,.3); border-top-color:#fff;
            animation:spin .8s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .btn {
            display:inline-block; background:var(--ambar); color:#1f2937; font-weight:800;
            text-decoration:none; padding:14px 30px; border-radius:9999px; font-size:1.05rem;
            box-shadow:0 8px 20px rgba(0,0,0,.25); transition:transform .15s, background .15s;
        }
        .btn:hover { background:#fbbf24; transform:scale(1.04); }
        .obs { margin-top:18px; font-size:.82rem; opacity:.75; }
    </style>
    <!-- Favicon / ícones (logo Pellegrini) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#b91c1c">
<script>
/* Origem da visita (07/11/2026): UTM / ids de clique dos anúncios OU o site de onde a pessoa veio
   (Google, Instagram...). Guarda 30 dias (última origem conhecida) pra o Clube saber de onde ela veio
   mesmo que entre pela home e só depois vá pro cadastro / Minha Conta. Não mexe no GA4 (GTM cuida). */
(function(){try{
  var p=new URLSearchParams(location.search), o={}, tem=false;
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','fbclid','ttclid'].forEach(function(k){
    var v=p.get(k); if(v){o[k]=String(v).slice(0,150); tem=true;} });
  if(!tem && document.referrer){ try{ var h=new URL(document.referrer).hostname.replace(/^www\./,'');
    if(h && h!==location.hostname.replace(/^www\./,'')){ o.ref=h.slice(0,80); tem=true; } }catch(e){} }
  if(tem){ o.ts=Date.now(); o.pagina=location.pathname.slice(0,60); var s=JSON.stringify(o);
    sessionStorage.setItem('cp_origem',s); try{localStorage.setItem('cp_origem',s);}catch(e){} }
}catch(e){}})();
window.cpOrigem=function(){try{var o=JSON.parse(sessionStorage.getItem('cp_origem')||localStorage.getItem('cp_origem')||'{}');
  if(o.ts&&Date.now()-o.ts>30*86400000) return {}; return o;}catch(e){return {}}};
</script>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PQ9GBFSJ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="card">
        <p class="marca">Clube <span>Pellegrini</span></p>
        <div class="spinner"></div>
        <p class="msg">Estamos te levando pro seu cadastro e brinde de boas-vindas...</p>
        <a id="continuar" class="btn" href="/cadastro" rel="noopener">Continuar agora &rarr;</a>
        <p class="obs">Se a página não abrir sozinha, toque no botão acima.</p>
    </div>

    <script>
    (function () {
        // Destino final (VIRADA 02/11/2026): cadastro do Clube proprio (/cadastro → Entrar / Me cadastrar)
        var OFERTA = "/cadastro";

        // 1) Lê os UTMs que chegaram na /clube (ex: vindo do ManyChat)
        var p = new URLSearchParams(window.location.search);
        var utm = {
            utm_source:   p.get("utm_source")   || "manychat",
            utm_medium:   p.get("utm_medium")   || "whatsapp",
            utm_campaign: p.get("utm_campaign") || "clube",
            utm_content:  p.get("utm_content")  || "",
            utm_term:     p.get("utm_term")     || ""
        };

        // 2) Monta o destino carregando os UTMs (atribuição também do lado Fidelizi)
        var qs = [];
        Object.keys(utm).forEach(function (k) { if (utm[k]) qs.push(k + "=" + encodeURIComponent(utm[k])); });
        var destino = OFERTA + (qs.length ? "?" + qs.join("&") : "");

        // 3) Evento pro GTM/GA4 (atribui o lead ao canal de origem)
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            event: "clube_lead",
            clube_destino: "clube_cadastro",
            utm_source: utm.utm_source,
            utm_medium: utm.utm_medium,
            utm_campaign: utm.utm_campaign,
            utm_content: utm.utm_content,
            utm_term: utm.utm_term
        });

        // 4) Botão de fallback aponta pro mesmo destino
        var btn = document.getElementById("continuar");
        if (btn) btn.href = destino;

        // 5) Redireciona após ~1,8s (tempo pro GTM disparar GA4/pixels). replace() = não fica no histórico.
        setTimeout(function () { window.location.replace(destino); }, 1800);
    })();
    </script>
</body>
</html>
