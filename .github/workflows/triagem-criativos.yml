# Esteira de triagem de criativos — Casa Pellegrini
# Destino no repo: .github/workflows/triagem-criativos.yml
# Secrets (ja existem): GEMINI_API_KEY, IG_ACCESS_TOKEN, GOOGLE_SHEETS_CREDS
#
# FONTE DA VERDADE = data/esteira-fila.json (o Claude le e escreve via git, com o PC do Antonio desligado).
# A planilha e um espelho somente-leitura.
#   - schedule/dispatch -> MODE=full   (tria no Gemini, grava JSON, espelha, commita)
#   - push no JSON      -> MODE=mirror (so reespelha na planilha, nao gasta cota do Gemini)
# O commit feito por esta Action usa o GITHUB_TOKEN, e o GitHub NAO redispara workflow nesse caso —
# entao nao existe loop. Push do Claude (PAT) dispara normalmente.
name: Triagem de Criativos

on:
  schedule:
    # 09h UTC = 06h BRT. Enquanto houver backlog processa MAX_POR_RODADA/dia;
    # depois so o incremental dos videos novos da agencia.
    - cron: "0 9 * * *"
  push:
    paths:
      - "data/esteira-fila.json"
  workflow_dispatch:
    inputs:
      max_por_rodada:
        description: "Quantos videos triar nesta rodada (free tier do Gemini aguenta ~100/dia)"
        default: "100"
      dry_run:
        description: "true = tria e mostra, mas nao grava"
        default: "false"

permissions:
  contents: write

concurrency:
  group: triagem-criativos
  cancel-in-progress: false

jobs:
  triar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth google-api-python-client
      - name: Rodar esteira
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN:     ${{ secrets.IG_ACCESS_TOKEN }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          SPREADSHEET_ID:      '1FZ9ufFd92IVNuFYoRF8UsKi_v7C_gXIxaqgwI5CocIY'
          MODE:                ${{ github.event_name == 'push' && 'mirror' || 'full' }}
          MAX_POR_RODADA:      ${{ github.event.inputs.max_por_rodada || '100' }}
          DRY_RUN:             ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/triagem_criativos.py
      - name: Salvar fila no repo
        if: github.event_name != 'push'
        run: |
          git config user.name "triagem-bot"
          git config user.email "actions@github.com"
          git add data/esteira-fila.json || true
          git diff --cached --quiet && echo "sem mudanca na fila" && exit 0
          git commit -m "esteira: fila atualizada $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git push && break; git pull --rebase && sleep 5; done
