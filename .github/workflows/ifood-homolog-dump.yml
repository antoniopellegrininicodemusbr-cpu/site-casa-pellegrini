name: iFood homologacao - dump bruto (TESTE)
on:
  workflow_dispatch:
    inputs:
      d0: {default: '2025-08-01'}
      d1: {default: '2025-08-03'}
      comp: {default: '2025-08'}
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests google-auth google-api-python-client
      - name: Dump
        env:
          IFOOD_TEST_CLIENT_ID:     ${{ secrets.IFOOD_TEST_CLIENT_ID }}
          IFOOD_TEST_CLIENT_SECRET: ${{ secrets.IFOOD_TEST_CLIENT_SECRET }}
          GOOGLE_SHEETS_CREDS:      ${{ secrets.GOOGLE_SHEETS_CREDS }}
          SPREADSHEET_TEST: '1yBuMGtcKRmD36cYqo-AYVhyCUAbjFQJYZNvMayGi6lE'
          D0: ${{ inputs.d0 }}
          D1: ${{ inputs.d1 }}
          COMP: ${{ inputs.comp }}
        run: python scripts/ifood_dump_homolog.py
