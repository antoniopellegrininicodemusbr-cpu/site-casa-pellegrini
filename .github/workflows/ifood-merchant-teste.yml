name: iFood - teste situacao da loja (so leitura)
on:
  workflow_dispatch:
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - name: Consulta Merchant (GET)
        env:
          IFOOD_CLIENT_ID:     ${{ secrets.IFOOD_CLIENT_ID }}
          IFOOD_CLIENT_SECRET: ${{ secrets.IFOOD_CLIENT_SECRET }}
        run: python scripts/ifood_merchant_status_teste.py
