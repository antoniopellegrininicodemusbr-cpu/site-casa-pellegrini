name: Geo-grid SEO/GEO local (Casa Pellegrini)

on:
  schedule:
    # Leitura vale so entre 11h e 17h BRT (segunda). O agendador do GitHub atrasa 4h-8h30 neste repo
    # (medido out-nov/2026: agendado 11h rodava 16h40-19h40). Depois das ~18h as hamburguerias concorrentes
    # abrem e o Google favorece quem esta aberto -> leitura da noite nao e comparavel (ver painel).
    # Mesma logica do robo do clima: agenda cedo contando com o atraso.
    - cron: '30 10 * * 1'   # 07:30 BRT -> deve cair ~11h30-16h
    - cron: '30 13 * * 1'   # 10:30 BRT -> reserva, se a 1a caiu cedo demais e foi descartada
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Rodar fora da janela 11h-17h (a leitura NAO sera comparavel)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: geo-grid
  cancel-in-progress: false

jobs:
  geo-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Trava de horario (so 11h-16h45 BRT, uma leitura por dia)
        id: trava
        env:
          FORCAR: ${{ inputs.forcar }}
        run: |
          H=$(TZ=America/Sao_Paulo date +%H%M); HOJE=$(date -u +%Y-%m-%d)
          echo "Agora (BRT): $H"
          if [ "$FORCAR" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Forcado manualmente."; exit 0; fi
          if [ "$H" -lt 1100 ] || [ "$H" -gt 1645 ]; then
            echo "Fora da janela 11h-16h45 BRT -> descartado (leitura nao seria comparavel)."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -f "data/geo-grid-$HOJE.json" ]; then
            echo "Ja existe leitura de hoje ($HOJE) -> nada a fazer."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.trava.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run geo-grid (Places API)
        if: steps.trava.outputs.run == 'true'
        env:
          PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          python scripts/geo_grid.py \
            --rows 7 --cols 7 --spacing-km 0.8 --topn 20 \
            --out data/geo-grid-latest.json

      - name: Append to history
        if: steps.trava.outputs.run == 'true'
        run: |
          mkdir -p data
          python - <<'PY'
          import json
          latest = json.load(open("data/geo-grid-latest.json", encoding="utf-8"))
          rec = {
              "generated_at": latest.get("generated_at"),
              "keywords": {
                  kw: {
                      "avg_rank": d.get("avg_rank"),
                      "found_pts": d.get("found_pts"),
                      "total_pts": d.get("total_pts"),
                      "top3_pts": d.get("top3_pts"),
                      "top3_share": d.get("top3_share"),
                  } for kw, d in latest.get("keywords", {}).items()
              },
          }
          with open("data/geo-grid-history.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(rec, ensure_ascii=False) + "\n")
          print("history append OK:", rec["generated_at"])
          PY

      - name: Commit results (com rebase para evitar conflito)
        if: steps.trava.outputs.run == 'true'
        run: |
          git config user.name "geo-grid-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "geo-grid: rodada $(date -u +%Y-%m-%dT%H:%MZ)"
            # Tenta empurrar; se main avancou enquanto rodavamos, rebase em cima e tenta de novo
            for i in 1 2 3; do
              if git push; then
                echo "Push OK na tentativa $i"
                break
              fi
              echo "Push falhou (tentativa $i), fazendo pull --rebase..."
              git pull --rebase origin main || { echo "Rebase falhou"; exit 1; }
              if [ $i -eq 3 ]; then
                echo "Desisti depois de 3 tentativas"
                exit 1
              fi
            done
          fi
