name: Sync Fidelizi → Sheets + Meta CAPI + TikTok Events

on:
  schedule:
    # 06:00 UTC = 03:00 BRT diário (madrugada, fora do horário de pico)
    - cron: '0 6 * * *'
  # Permite rodar manualmente pela aba "Actions" do GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth google-api-python-client

      - name: Run Fidelizi → Sheets + Meta CAPI + TikTok Events
        env:
          FIDELIZI_APP_TOKEN:    ${{ secrets.FIDELIZI_APP_TOKEN }}
          FIDELIZI_ACCESS_TOKEN: ${{ secrets.FIDELIZI_ACCESS_TOKEN }}
          FIDELIZI_SHOP_ID:      '4477'
          SPREADSHEET_ID:        '1w8L28LCKWv4Mc5t4nHhZ83I0joLhX6tK40x3BX3TbfM'
          GOOGLE_SHEETS_CREDS:   ${{ secrets.GOOGLE_SHEETS_CREDS }}
          META_CAPI_TOKEN:       ${{ secrets.META_CAPI_TOKEN }}
          META_DATASET_ID:       ${{ secrets.META_DATASET_ID }}
          TIKTOK_EVENTS_TOKEN:   ${{ secrets.TIKTOK_EVENTS_TOKEN }}
          TIKTOK_EVENT_SET_ID:   ${{ secrets.TIKTOK_EVENT_SET_ID }}
        run: python scripts/sync_fidelizi_to_sheets.py
