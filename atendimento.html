<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Atendimento — Casa Pellegrini</title>
<style>
  :root{
    --bg:#14100c; --card:#1f1913; --card2:#282017; --linha:#3a2f22;
    --txt:#f2e9dc; --txt2:#b8a88f; --ouro:#c9a24b; --verde:#4caf7d;
    --verm:#e05d4b; --azul:#5b9bd5; --roxo:#9b7bd5;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--linha)}
  header h1{font-size:16px;color:var(--ouro);font-weight:600}
  header .status-conexao{font-size:12px;color:var(--txt2);margin-left:auto}
  main{display:flex;flex:1;overflow:hidden}
  /* ===== lista ===== */
  #lista{width:340px;min-width:260px;border-right:1px solid var(--linha);display:flex;flex-direction:column;background:var(--card)}
  #filtros{display:flex;gap:6px;padding:10px;flex-wrap:wrap;border-bottom:1px solid var(--linha)}
  #filtros button{background:var(--card2);color:var(--txt2);border:1px solid var(--linha);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
  #filtros button.ativo{background:var(--ouro);color:#14100c;border-color:var(--ouro);font-weight:600}
  .fbadge{display:none;background:var(--verm);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:1px 6px;margin-left:2px;min-width:16px;text-align:center;line-height:16px}
  #conversas{flex:1;overflow-y:auto}
  .conv{padding:10px 12px;border-bottom:1px solid var(--linha);cursor:pointer;display:flex;flex-direction:column;gap:3px}
  .conv:hover{background:var(--card2)}
  .conv.sel{background:var(--card2);border-left:3px solid var(--ouro)}
  .conv .topo{display:flex;align-items:center;gap:6px}
  .conv .nome{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;text-transform:uppercase}
  .b-nao_lida{background:var(--verm);color:#fff}
  .b-precisa_humano{background:#e8933a;color:#14100c}
  .b-aguardando_confirmacao{background:var(--roxo);color:#fff}
  .b-respondida{background:var(--verde);color:#fff}
  .b-fechada{background:var(--linha);color:var(--txt2)}
  .conv .previa{font-size:12px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .meta{font-size:11px;color:var(--txt2);display:flex;gap:8px}
  .canal{font-weight:600}
  .canal.whatsapp{color:var(--verde)} .canal.instagram{color:var(--roxo)} .canal.facebook{color:var(--azul)}
  .naoLidas{background:var(--verm);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
  /* ===== chat ===== */
  #chat{flex:1;display:flex;flex-direction:column;background:var(--bg)}
  #chat-topo{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;min-height:52px}
  .modo-badge{font-size:14px;font-weight:800;padding:6px 14px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
  .mb-bot{background:#2e4257;color:#8ec5ff}
  .mb-humano{background:#e8933a;color:#14100c}
  #chat-topo .acoes{margin-left:auto;display:flex;gap:6px}
  #chat-topo button{background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  #chat-topo button:hover{border-color:var(--ouro)}
  #mensagens{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:70%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .msg .hora{display:block;font-size:10px;color:rgba(255,255,255,.45);margin-top:4px;text-align:right}
  .m-cliente{background:var(--card2);align-self:flex-start;border-bottom-left-radius:3px}
  .m-atendente{background:#3e5c41;align-self:flex-end;border-bottom-right-radius:3px}
  .m-bot{background:#2e4257;align-self:flex-end;border-bottom-right-radius:3px}
  .m-bot::before{content:"🤖 bot";font-size:10px;color:rgba(255,255,255,.5);display:block}
  #resposta{display:flex;gap:8px;padding:12px;background:var(--card);border-top:1px solid var(--linha)}
  #resposta textarea{flex:1;background:var(--card2);border:1px solid var(--linha);border-radius:10px;color:var(--txt);padding:10px;font-size:14px;resize:none;height:60px}
  #resposta button{background:var(--ouro);color:#14100c;border:none;border-radius:10px;padding:0 22px;font-weight:700;font-size:14px;cursor:pointer}
  #resposta button:disabled{opacity:.5;cursor:default}
  #vazio{flex:1;display:flex;align-items:center;justify-content:center;color:var(--txt2);font-size:14px}
  /* ===== login ===== */
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:10}
  #login input{background:var(--card2);border:1px solid var(--linha);border-radius:10px;color:var(--txt);padding:12px 16px;font-size:15px;width:280px;text-align:center}
  #login button{background:var(--ouro);color:#14100c;border:none;border-radius:10px;padding:12px 30px;font-weight:700;cursor:pointer}
  #login .erro{color:var(--verm);font-size:13px;min-height:16px}
  @media(max-width:700px){
    #lista{width:100%;min-width:0}
    #chat{position:fixed;inset:0;z-index:5;display:none}
    body.vendo-chat #chat{display:flex}
  }
</style>
</head>
<body>
<div id="login">
  <h1 style="color:var(--ouro)">🍻 Atendimento Casa Pellegrini</h1>
  <input id="chave" type="password" placeholder="Chave de acesso" autocomplete="off">
  <div class="erro" id="login-erro"></div>
  <button onclick="entrar()">Entrar</button>
</div>

<header>
  <h1>🍻 Atendimento</h1>
  <span class="status-conexao" id="conexao">carregando…</span>
  <button id="btn-som" onclick="alternarSom()" title="Ligar/desligar alerta sonoro" style="margin-left:12px;background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer">🔔 Som</button>
  <button id="btn-bot" onclick="abrirConfigBot()" style="margin-left:8px;background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer">🤖 Bot</button>
</header>
<div id="modal-bot" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;align-items:center;justify-content:center">
  <div style="background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:22px;width:320px">
    <h2 style="color:var(--ouro);font-size:16px;margin-bottom:6px">🤖 Bot de atendimento</h2>
    <p style="color:var(--txt2);font-size:12px;margin-bottom:16px">Escolha em quais canais o bot responde sozinho. Onde estiver desligado, tudo cai na fila pra vocês.</p>
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px"><input type="checkbox" id="bot-facebook"> Facebook Messenger</label>
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px"><input type="checkbox" id="bot-instagram"> Instagram <span style="color:var(--txt2);font-size:11px">(só após o corte do ManyChat)</span></label>
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px"><input type="checkbox" id="bot-whatsapp"> WhatsApp <span style="color:var(--txt2);font-size:11px">(só após migrar o número)</span></label>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button onclick="salvarConfigBot()" style="flex:1;background:var(--ouro);color:#14100c;border:none;border-radius:10px;padding:10px;font-weight:700;cursor:pointer">Salvar</button>
      <button onclick="document.getElementById('modal-bot').style.display='none'" style="background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:10px;padding:10px 16px;cursor:pointer">Fechar</button>
    </div>
  </div>
</div>
<main>
  <div id="lista">
    <div id="filtros">
      <button data-f="todas" class="ativo">Todas</button>
      <button data-f="precisa_humano">🙋 Precisa humano <span class="fbadge" id="fb-precisa_humano"></span></button>
      <button data-f="nao_lida">🔴 Não lidas <span class="fbadge" id="fb-nao_lida"></span></button>
      <button data-f="aguardando_confirmacao">🟣 Reservas <span class="fbadge" id="fb-aguardando_confirmacao"></span></button>
      <button data-f="respondida">🟢 Respondidas</button>
      <button data-f="fechada">Fechadas</button>
    </div>
    <div id="conversas"></div>
  </div>
  <div id="chat">
    <div id="chat-topo">
      <button id="voltar" style="display:none" onclick="document.body.classList.remove('vendo-chat')">←</button>
      <div>
        <div id="chat-nome" style="font-weight:600;font-size:16px">—</div>
        <div id="chat-canal" style="font-size:12px;color:var(--txt2)"></div>
      </div>
      <span id="chat-modo" class="modo-badge" style="display:none"></span>
      <div class="acoes">
        <button id="btn-devolver" onclick="devolverBot()" style="display:none">🤖 Devolver ao bot</button>
        <button onclick="mudarStatus('respondida')">✓ Lida</button>
        <button onclick="mudarStatus('fechada')">Fechar</button>
      </div>
    </div>
    <div id="mensagens"><div id="vazio">Selecione uma conversa</div></div>
    <div id="resposta">
      <textarea id="texto" placeholder="Escreva a resposta… (Enter envia, Shift+Enter quebra linha)"></textarea>
      <button id="enviar" onclick="responder()">Enviar</button>
    </div>
  </div>
</main>

<script>
const API = "/api/atendimento";
let CHAVE = localStorage.getItem("atd_chave") || "";
let convSel = null, filtro = "todas", conversas = [];

const $ = (id) => document.getElementById(id);

function headers(extra){ return Object.assign({"X-Painel-Key": CHAVE}, extra||{}); }

// ===== ALERTA SONORO =====
// Conversas nesses status precisam de um atendente humano.
const PRECISA_HUMANO = ["nao_lida","precisa_humano","aguardando_confirmacao"];
let somLigado = localStorage.getItem("atd_som") !== "off";
let audioCtx = null;
let pendentesAntes = null;
function initAudio(){
  if (!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, quando){
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = "sine"; o.frequency.value = freq;
  const t = audioCtx.currentTime + quando;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
  o.start(t); o.stop(t + 0.33);
}
function tocarAlerta(){
  if (!somLigado) return;
  initAudio();
  beep(880, 0); beep(1175, 0.38); // duas notinhas ("din-don")
}
function alternarSom(){
  somLigado = !somLigado;
  localStorage.setItem("atd_som", somLigado ? "on" : "off");
  $("btn-som").textContent = somLigado ? "🔔 Som" : "🔕 Mudo";
  if (somLigado){ initAudio(); tocarAlerta(); } // toca pra confirmar
}
// desbloqueia o áudio no primeiro clique/tecla (política do navegador)
document.addEventListener("click", initAudio, {once:true});
document.addEventListener("keydown", initAudio, {once:true});

async function entrar(){
  CHAVE = $("chave").value.trim();
  initAudio();
  const r = await fetch(API + "/conversas", {headers: headers()});
  if (r.status === 401){ $("login-erro").textContent = "Chave incorreta."; return; }
  localStorage.setItem("atd_chave", CHAVE);
  $("login").style.display = "none";
  ciclo();
}

function tempoRel(ts){
  if (!ts) return "";
  const d = ts._seconds ? new Date(ts._seconds*1000) : new Date(ts);
  const dif = (Date.now() - d.getTime())/60000;
  if (dif < 1) return "agora";
  if (dif < 60) return Math.floor(dif) + "min";
  if (dif < 1440) return Math.floor(dif/60) + "h";
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
}
function horaMsg(ts){
  if (!ts) return "";
  const d = ts._seconds ? new Date(ts._seconds*1000) : new Date(ts);
  return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
const rotuloCanal = {whatsapp:"WhatsApp", instagram:"Instagram", facebook:"Facebook"};

async function carregarConversas(){
  try{
    const r = await fetch(API + "/conversas", {headers: headers()});
    if (!r.ok) throw new Error(r.status);
    conversas = (await r.json()).conversas || [];
    $("conexao").textContent = "atualizado " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    // alerta sonoro: se aumentou o nº de conversas que precisam de humano, toca
    const pend = conversas.filter((c) => PRECISA_HUMANO.includes(c.status)).length;
    if (pendentesAntes !== null && pend > pendentesAntes) tocarAlerta();
    pendentesAntes = pend;
    document.title = (pend ? "(" + pend + ") " : "") + "Atendimento — Casa Pellegrini";
    atualizarBadgesFiltro();
    desenharLista();
    // mantém o cabeçalho da conversa aberta em dia (nome/modo)
    if (convSel){
      const aberta = conversas.find((x) => x.id === convSel);
      if (aberta) setCabecalho(aberta);
    }
  }catch(e){ $("conexao").textContent = "⚠️ sem conexão"; }
}

function atualizarBadgesFiltro(){
  const cont = {precisa_humano:0, nao_lida:0, aguardando_confirmacao:0};
  conversas.forEach((c) => { if (cont[c.status] !== undefined) cont[c.status]++; });
  Object.keys(cont).forEach((s) => {
    const el = $("fb-" + s);
    if (el){ el.textContent = cont[s] || ""; el.style.display = cont[s] ? "inline-block" : "none"; }
  });
}

function desenharLista(){
  const el = $("conversas"); el.innerHTML = "";
  conversas
    .filter((c) => filtro === "todas" ? c.status !== "fechada" : c.status === filtro)
    .forEach((c) => {
      const div = document.createElement("div");
      div.className = "conv" + (c.id === convSel ? " sel" : "");
      div.innerHTML =
        '<div class="topo"><span class="nome">' + (c.nome || c.usuarioId) + '</span>' +
        (c.naoLidas ? '<span class="naoLidas">' + c.naoLidas + "</span>" : "") +
        '<span class="badge b-' + c.status + '">' + (c.status||"").replace("_"," ") + "</span></div>" +
        '<div class="previa">' + (c.ultimaMensagem || "") + "</div>" +
        '<div class="meta"><span class="canal ' + c.canal + '">' + (rotuloCanal[c.canal]||c.canal) + "</span><span>" + tempoRel(c.ultimaEm) + "</span></div>";
      div.onclick = () => abrirConversa(c.id);
      el.appendChild(div);
    });
}

async function abrirConversa(id){
  convSel = id;
  const c = conversas.find((x) => x.id === id) || {};
  setCabecalho(c);
  document.body.classList.add("vendo-chat");
  if (window.innerWidth <= 700) $("voltar").style.display = "block";
  desenharLista();
  await carregarMensagens();
  if (c.naoLidas) fetch(API + "/status", {method:"POST", headers: headers({"Content-Type":"application/json"}), body: JSON.stringify({conv:id, status: c.status === "nao_lida" ? "respondida" : c.status})});
}

async function carregarMensagens(){
  if (!convSel) return;
  const r = await fetch(API + "/mensagens?conv=" + encodeURIComponent(convSel), {headers: headers()});
  if (!r.ok) return;
  const ms = (await r.json()).mensagens || [];
  const el = $("mensagens"); el.innerHTML = "";
  ms.forEach((m) => {
    const div = document.createElement("div");
    div.className = "msg m-" + (m.de || "cliente");
    div.textContent = m.texto || "[" + (m.tipo||"mídia") + "]";
    const h = document.createElement("span");
    h.className = "hora"; h.textContent = horaMsg(m.timestamp);
    div.appendChild(h);
    el.appendChild(div);
  });
  el.scrollTop = el.scrollHeight;
}

async function responder(){
  const texto = $("texto").value.trim();
  if (!texto || !convSel) return;
  $("enviar").disabled = true;
  try{
    const r = await fetch(API + "/responder", {method:"POST", headers: headers({"Content-Type":"application/json"}), body: JSON.stringify({conv: convSel, texto})});
    if (!r.ok){
      const j = await r.json().catch(() => ({}));
      alert("Envio falhou: " + JSON.stringify(j.detalhe || j.erro || r.status));
    } else {
      $("texto").value = "";
      await carregarMensagens(); await carregarConversas();
    }
  } finally { $("enviar").disabled = false; }
}

async function mudarStatus(status){
  if (!convSel) return;
  await fetch(API + "/status", {method:"POST", headers: headers({"Content-Type":"application/json"}), body: JSON.stringify({conv: convSel, status})});
  await carregarConversas();
}

async function abrirConfigBot(){
  const r = await fetch(API + "/config", {headers: headers()});
  const cfg = r.ok ? await r.json() : {bot_canais:{}};
  const c = cfg.bot_canais || {};
  $("bot-facebook").checked = !!c.facebook;
  $("bot-instagram").checked = !!c.instagram;
  $("bot-whatsapp").checked = !!c.whatsapp;
  $("modal-bot").style.display = "flex";
}
async function salvarConfigBot(){
  const bot_canais = {
    facebook: $("bot-facebook").checked,
    instagram: $("bot-instagram").checked,
    whatsapp: $("bot-whatsapp").checked,
  };
  await fetch(API + "/config", {method:"POST", headers: headers({"Content-Type":"application/json"}), body: JSON.stringify({bot_canais})});
  $("modal-bot").style.display = "none";
  atualizarBotBadge();
}
async function atualizarBotBadge(){
  try{
    const r = await fetch(API + "/config", {headers: headers()});
    if(!r.ok) return;
    const c = (await r.json()).bot_canais || {};
    const on = Object.keys(c).filter(k => c[k]);
    $("btn-bot").textContent = on.length ? "🤖 Bot: " + on.join(", ") : "🤖 Bot: desligado";
  }catch(e){}
}
function setCabecalho(c){
  $("chat-nome").textContent = c.nome || c.usuarioId || "";
  $("chat-canal").textContent = rotuloCanal[c.canal] || c.canal || "";
  const badge = $("chat-modo");
  if (c.modo === "humano"){
    badge.textContent = "👤 ATENDENTE";
    badge.className = "modo-badge mb-humano";
  } else {
    badge.textContent = "🤖 BOT";
    badge.className = "modo-badge mb-bot";
  }
  badge.style.display = "inline-block";
  $("btn-devolver").style.display = (c.modo === "humano") ? "inline-block" : "none";
}

async function devolverBot(){
  if (!convSel) return;
  await fetch(API + "/devolver-bot", {method:"POST", headers: headers({"Content-Type":"application/json"}), body: JSON.stringify({conv: convSel})});
  await carregarConversas();
  const c = conversas.find((x) => x.id === convSel);
  if (c) setCabecalho(c); // atualiza o selo pra 🤖 BOT na hora
}

$("texto").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); responder(); }
});
document.querySelectorAll("#filtros button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("#filtros button").forEach((x) => x.classList.remove("ativo"));
    b.classList.add("ativo"); filtro = b.dataset.f; desenharLista();
  };
});

function ciclo(){
  $("btn-som").textContent = somLigado ? "🔔 Som" : "🔕 Mudo";
  carregarConversas();
  atualizarBotBadge();
  setInterval(carregarConversas, 10000);
  setInterval(() => { if (convSel) carregarMensagens(); }, 10000);
}

if (CHAVE){
  $("login").style.display = "none";
  fetch(API + "/conversas", {headers: headers()}).then((r) => {
    if (r.status === 401){ $("login").style.display = "flex"; localStorage.removeItem("atd_chave"); }
    else ciclo();
  });
}
</script>
</body>
</html>
